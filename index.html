<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS Cloud Radar</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #ececec; text-align: center; padding: 40px 20px; margin: 0; }
        .radar-spinner { width: 60px; height: 60px; border: 4px solid #3f3f46; border-top: 4px solid #4ade80; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin-bottom: 10px; color: #4ade80; font-weight: 600;}
        p { color: #a1a1aa; font-size: 14px; line-height: 1.5; max-width: 400px; margin: 0 auto 20px auto;}
        .log-container { background: #1e1e1e; padding: 15px; border-radius: 12px; border: 1px solid #27272a; max-width: 400px; margin: 0 auto; text-align: left; }
        .log { font-size: 13px; color: #71717a; max-height: 150px; overflow-y: auto; font-family: monospace; line-height: 1.4; }
        .btn-retry { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: none; margin: 20px auto 0 auto; }
        .ip-card { background: #27272a; padding: 12px; margin-top: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .ip-card a { color: #4ade80; text-decoration: none; font-weight: bold; background: #18181b; padding: 6px 12px; border-radius: 6px; }
        .device-info { color: #d4d4d8; font-size: 14px; }
        .device-time { color: #a1a1aa; font-size: 12px; }
    </style>
</head>
<body>
    <div class="radar-spinner" id="spinner"></div>
    <h2 id="status-title">Querying Cloud Dispatcher...</h2>
    <p>Searching for active BMS boards connected to your hotspot.</p>
    
    <button class="btn-retry" id="btn-retry" onclick="location.reload()">🔄 Scan Again</button>

    <div id="results" style="max-width: 400px; margin: 0 auto; text-align: left; display: none;">
        <!-- Board list will appear here -->
    </div>

    <div class="log-container" style="margin-top: 25px;">
        <div class="log" id="log">Connecting to Cloud...<br></div>
    </div>

    <script>
        const logEl = document.getElementById('log');
        function log(msg) { logEl.innerHTML = msg + '<br>' + logEl.innerHTML; }
        
        const DISPATCHER_URL = "https://script.google.com/macros/s/AKfycbyWCo9NEyW4QqLA6iLRpBiNqc9gO2E43JaQnth51DQTxnVcc7A1sMJyIHjYrkj22ks8FA/exec";

        async function scanNetwork() {
            try {
                log("Fetching board list from Google Cloud...");
                const res = await fetch(DISPATCHER_URL + "?action=list");
                
                if (res.ok) {
                    const data = await res.json();
                    log(`Found ${data.length} registered boards.`);
                    
                    document.getElementById('spinner').style.animation = "none";
                    document.getElementById('spinner').style.borderColor = "#4ade80";
                    
                    if (data.length === 0) {
                        document.getElementById('status-title').innerText = "No Boards Registered";
                        document.getElementById('status-title').style.color = "#ef4444";
                        log("<span style='color:#ef4444;'>No boards have reported their IP yet.</span>");
                        document.getElementById('btn-retry').style.display = "block";
                        return;
                    }
                    
                    document.getElementById('status-title').innerText = "Cloud Query Complete";
                    document.getElementById('results').style.display = "block";
                    
                    // Sort by time (newest first)
                    data.sort((a, b) => new Date(b.time) - new Date(a.time));
                    
                    let html = `<h3 style="color:#ececec; margin-bottom: 10px; font-size: 16px;">Select your board:</h3>`;
                    
                    data.forEach(board => {
                        const date = new Date(board.time);
                        const timeStr = date.toLocaleString();
                        
                        html += `
                        <div class="ip-card">
                            <div>
                                <div class="device-info">MAC: ${board.mac}</div>
                                <div class="device-time">Last seen: ${timeStr}</div>
                            </div>
                            <a href="http://${board.ip}">Connect</a>
                        </div>`;
                    });
                    
                    document.getElementById('results').innerHTML = html;
                    
                    // Auto-redirect if there's only 1 board recently active (within 10 minutes)
                    if (data.length > 0) {
                        const ageMs = new Date() - new Date(data[0].time);
                        if (ageMs < 10 * 60 * 1000) {
                            log(`<span style="color:#4ade80; font-weight:bold;">Auto-redirecting to ${data[0].ip}...</span>`);
                            setTimeout(() => {
                                window.location.href = `http://${data[0].ip}`;
                            }, 1500);
                        }
                    }
                } else {
                    throw new Error("HTTP " + res.status);
                }
            } catch (e) {
                document.getElementById('status-title').innerText = "Cloud Error";
                document.getElementById('status-title').style.color = "#ef4444";
                document.getElementById('spinner').style.animation = "none";
                document.getElementById('spinner').style.borderColor = "#3f3f46";
                document.getElementById('spinner').style.borderTopColor = "#ef4444";
                document.getElementById('btn-retry').style.display = "block";
                log("<span style='color:#ef4444; font-weight:bold;'>Failed to connect to Cloud.</span>");
                log(e.message);
            }
        }

        setTimeout(scanNetwork, 500);
    </script>
</body>
</html>
